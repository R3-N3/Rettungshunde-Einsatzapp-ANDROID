[versions]
agp = "9.0.1"
kotlin = "2.3.10"

composeBom = "2026.02.01"

navigationCompose = "2.9.7"
appcompat = "1.7.1"
room = "2.8.4"
okhttp = "5.3.2"
retrofit = "3.0.0"
osmdroidAndroid = "6.1.20"
colorpickerCompose = "1.1.3"
playServicesLocation = "21.3.0"

[libraries]
# Compose BOM (neu)
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }

# Compose libs OHNE Version (werden über BOM gesteuert)
androidx-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-material3 = { module = "androidx.compose.material3:material3" }
androidx-ui-tooling-preview-android = { module = "androidx.compose.ui:ui-tooling-preview-android" }

# Rest wie gehabt …
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
colorpicker-compose = { module = "com.github.skydoves:colorpicker-compose", version.ref = "colorpickerCompose" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
osmdroid-android = { module = "org.osmdroid:osmdroid-android", version.ref = "osmdroidAndroid" }
retrofit-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
play-services-location = { module = "com.google.android.gms:play-services-location", version.ref = "playServicesLocation" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }